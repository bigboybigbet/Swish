name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Byte-compile
        run: python -m compileall -q config.py engine data research nba_app.py optuna_tuner.py player_impact_updater.py
      - name: Tests
        run: python -m pytest -q
