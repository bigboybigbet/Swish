<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Swish">
  <!-- Small-size variant of docs/assets/logo.svg: bigger ball, heavier arc, no guide line. -->
  <defs>
    <linearGradient id="fv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="fv-ball" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <clipPath id="fv-clip"><circle cx="338" cy="176" r="118"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fv-bg)"/>
  <path d="M76 424 C 196 424, 212 300, 250 248" fill="none" stroke="#f97316" stroke-opacity="0.85"
