    <line x1="220" y1="176" x2="456" y2="176"/>
    <line x1="338" y1="58" x2="338" y2="294"/>
    <path d="M256 92 C 302 144, 302 208, 256 260"/>
    <path d="M420 92 C 374 144, 374 208, 420 260"/>
