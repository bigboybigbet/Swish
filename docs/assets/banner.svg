<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="NBA Quant: probabilistic NBA game forecasts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- logistic win-probability curve with a 50% guide -->
  <line x1="850" y1="155" x2="1140" y2="155" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="6 6"/>
  <text x="1146" y="160" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">50%</text>
  <path d="M700 250 C 880 250, 940 70, 1140 60" fill="none" stroke="url(#curve)" stroke-width="4"/>
  <g fill="#f97316">
    <circle cx="751" cy="245" r="4" fill-opacity="0.5"/>
    <circle cx="817" cy="222" r="4" fill-opacity="0.7"/>
    <circle cx="912" cy="159" r="5"/>
    <circle cx="1012" cy="94" r="4" fill-opacity="0.8"/>
  </g>
  <text x="60" y="118" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700">NBA Quant</text>
  <text x="62" y="162" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Probabilistic NBA game forecasts: win probability, spread and total</text>
  <text x="62" y="198" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Elo · team form · calibrated gradient boosting · walk-forward tested on 14 seasons</text>
</svg>
