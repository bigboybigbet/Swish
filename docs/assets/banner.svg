<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Swish: NBA forecasts that hit nothing but net">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- logistic win-probability curve with a 50% guide -->
  <line x1="850" y1="155" x2="1140" y2="155" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="6 6"/>
  <text x="1146" y="160" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">50%</text>
  <path d="M700 250 C 880 250, 940 70, 1140 60" fill="none" stroke="url(#curve)" stroke-width="4"/>
  <g fill="#f97316">
    <circle cx="751" cy="245" r="4" fill-opacity="0.5"/>
    <circle cx="817" cy="222" r="4" fill-opacity="0.7"/>
    <circle cx="912" cy="159" r="5"/>
    <circle cx="1012" cy="94" r="4" fill-opacity="0.8"/>
  </g>
  <svg x="56" y="60" width="120" height="120" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="bn-ball" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="bn-arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <clipPath id="bn-ball-clip"><circle cx="372" cy="150" r="78"/></clipPath>
  </defs>

  <!-- app-icon tile -->
  <rect width="512" height="512" rx="112" fill="url(#bn-bg)"/>

  <!-- 50% guide of the win-probability curve -->
  <line x1="84" y1="268" x2="428" y2="268" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6" stroke-dasharray="14 16" stroke-linecap="round"/>

  <!-- the shot: a logistic (S) curve that is also the ball's arc -->
  <path d="M84 408 C 214 408, 232 268, 268 222 S 318 168, 330 164" fill="none"
        stroke="url(#bn-arc)" stroke-width="30" stroke-linecap="round"/>
  <circle cx="132" cy="404" r="10" fill="#f97316" fill-opacity="0.35"/>
  <circle cx="206" cy="372" r="12" fill="#f97316" fill-opacity="0.6"/>

  <!-- ball -->
  <circle cx="372" cy="150" r="78" fill="url(#bn-ball)"/>
  <g clip-path="url(#bn-ball-clip)" fill="none" stroke="#0b1220" stroke-width="9" stroke-linecap="round">
    <line x1="294" y1="150" x2="450" y2="150"/>
    <line x1="372" y1="72" x2="372" y2="228"/>
    <path d="M318 92 C 348 126, 348 174, 318 208"/>
    <path d="M426 92 C 396 126, 396 174, 426 208"/>
  </g>
  <circle cx="372" cy="150" r="78" fill="none" stroke="#0b1220" stroke-opacity="0.35" stroke-width="4"/>
</svg>
  <rect x="56.5" y="60.5" width="119" height="119" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="200" y="118" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700">Swish</text>
  <text x="202" y="162" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">NBA forecasts that hit nothing but net</text>
  <text x="202" y="198" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Win probability · spread · total · Kalman-Elo ratings tested on 14 seasons</text>
</svg>
