<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Swish">
  <defs>
    <linearGradient id="sw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="sw-ball" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="sw-arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <clipPath id="sw-ball-clip"><circle cx="372" cy="150" r="78"/></clipPath>
  </defs>

  <!-- app-icon tile -->
  <rect width="512" height="512" rx="112" fill="url(#sw-bg)"/>

  <!-- 50% guide of the win-probability curve -->
  <line x1="84" y1="268" x2="428" y2="268" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6" stroke-dasharray="14 16" stroke-linecap="round"/>

  <!-- the shot: a logistic (S) curve that is also the ball's arc -->
  <path d="M84 408 C 214 408, 232 268, 268 222 S 318 168, 330 164" fill="none"
        stroke="url(#sw-arc)" stroke-width="30" stroke-linecap="round"/>
  <circle cx="132" cy="404" r="10" fill="#f97316" fill-opacity="0.35"/>
  <circle cx="206" cy="372" r="12" fill="#f97316" fill-opacity="0.6"/>

  <!-- ball -->
  <circle cx="372" cy="150" r="78" fill="url(#sw-ball)"/>
  <g clip-path="url(#sw-ball-clip)" fill="none" stroke="#0b1220" stroke-width="9" stroke-linecap="round">
    <line x1="294" y1="150" x2="450" y2="150"/>
    <line x1="372" y1="72" x2="372" y2="228"/>
    <path d="M318 92 C 348 126, 348 174, 318 208"/>
    <path d="M426 92 C 396 126, 396 174, 426 208"/>
  </g>
  <circle cx="372" cy="150" r="78" fill="none" stroke="#0b1220" stroke-opacity="0.35" stroke-width="4"/>
</svg>
