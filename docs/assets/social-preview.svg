<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Swish: NBA forecasts that hit nothing but net">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14213d"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#sp-bg)"/>
  <svg x="110" y="170" width="300" height="300" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="sp-ball" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="sp-arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <clipPath id="sp-ball-clip"><circle cx="372" cy="150" r="78"/></clipPath>
  </defs>

  <!-- app-icon tile -->
  <rect width="512" height="512" rx="112" fill="url(#sp-bg)"/>

  <!-- 50% guide of the win-probability curve -->
  <line x1="84" y1="268" x2="428" y2="268" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6" stroke-dasharray="14 16" stroke-linecap="round"/>

  <!-- the shot: a logistic (S) curve that is also the ball's arc -->
  <path d="M84 408 C 214 408, 232 268, 268 222 S 318 168, 330 164" fill="none"
        stroke="url(#sp-arc)" stroke-width="30" stroke-linecap="round"/>
  <circle cx="132" cy="404" r="10" fill="#f97316" fill-opacity="0.35"/>
  <circle cx="206" cy="372" r="12" fill="#f97316" fill-opacity="0.6"/>

  <!-- ball -->
  <circle cx="372" cy="150" r="78" fill="url(#sp-ball)"/>
  <g clip-path="url(#sp-ball-clip)" fill="none" stroke="#0b1220" stroke-width="9" stroke-linecap="round">
    <line x1="294" y1="150" x2="450" y2="150"/>
    <line x1="372" y1="72" x2="372" y2="228"/>
    <path d="M318 92 C 348 126, 348 174, 318 208"/>
    <path d="M426 92 C 396 126, 396 174, 426 208"/>
  </g>
  <circle cx="372" cy="150" r="78" fill="none" stroke="#0b1220" stroke-opacity="0.35" stroke-width="4"/>
</svg>
  <rect x="111" y="171" width="298" height="298" rx="65" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <g font-family="Fira Sans, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="470" y="300" fill="#ffffff" font-size="112" font-weight="700" letter-spacing="-2">Swish</text>
    <text x="474" y="364" fill="#cbd5e1" font-size="38">NBA forecasts that hit nothing but net</text>
    <text x="474" y="420" fill="#94a3b8" font-size="26">Win probability · spread · total · Kalman-Elo team ratings</text>
    <text x="474" y="500" fill="#f97316" font-size="24" font-weight="600">64.5% picks correct over 8,874 games, walk-forward tested</text>
  </g>
</svg>
